# Agent Orchestrator Configuration
agent:
  name: "modular-agent-orchestrator"
  description: "Config-driven agent orchestration with tool execution loop and retries"

model:
  name: "gemini-1.5-flash"
  temperature: 0.2
  max_tokens: 1024

execution:
  max_iterations: 5
  timeout_seconds: 15.0
  max_retries: 3
  backoff_factor: 1.5
  retry_on_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504

logging:
  log_file: "logs/orchestrator.jsonl"
  log_level: "INFO"
  structured_json: true

tools:
  - name: "calculator"
    enabled: true
    timeout: 3.0
  - name: "http_get"
    enabled: true
    timeout: 5.0
  - name: "text_summarize"
    enabled: true
    timeout: 5.0
